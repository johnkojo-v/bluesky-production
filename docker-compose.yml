version: '3.9'
services:
  app:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: sqlite
      DB_PATH: /tmp/bluesky-production.sqlite

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bluesky_prod
      POSTGRES_USER: bluesky_user
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
